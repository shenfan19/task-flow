name: Bug report
description: Something in Tasks Flowchart does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: task-lines
    attributes:
      label: Task lines
      description: A few task lines from your note that show the problem.
      render: markdown
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Shown under Settings → About.
    validations:
      required: true
  - type: input
    id: plugin-versions
    attributes:
      label: Tasks Flowchart and Tasks versions
      description: Shown under Settings → Community plugins.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
